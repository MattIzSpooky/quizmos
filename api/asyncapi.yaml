asyncapi: 3.0.0
info:
  title: Quizmos Websocket API
  version: 0.1.0
  description: >
    Live gameplay channel. Connect to /ws/games/{code}?client_id={uuid} after
    joining via POST /api/games/join. Only the message payload schemas under
    components.schemas are used for code generation (via quicktype); the
    {type, payload} envelope itself is hand-written on both client and server.

defaultContentType: application/json

channels:
  gameSession:
    address: /ws/games/{code}
    parameters:
      code:
        description: Game join code
    messages:
      presencePlayerJoined:
        $ref: "#/components/messages/presencePlayerJoined"
      presencePlayerLeft:
        $ref: "#/components/messages/presencePlayerLeft"
      playerKicked:
        $ref: "#/components/messages/playerKicked"
      gameStarted:
        $ref: "#/components/messages/gameStarted"
      questionStarted:
        $ref: "#/components/messages/questionStarted"
      questionEnded:
        $ref: "#/components/messages/questionEnded"
      questionReviewed:
        $ref: "#/components/messages/questionReviewed"
      questionAnswersReset:
        $ref: "#/components/messages/questionAnswersReset"
      answerResult:
        $ref: "#/components/messages/answerResult"
      leaderboardUpdated:
        $ref: "#/components/messages/leaderboardUpdated"
      gameEnded:
        $ref: "#/components/messages/gameEnded"
      errorMessage:
        $ref: "#/components/messages/errorMessage"
      answerSubmit:
        $ref: "#/components/messages/answerSubmit"

operations:
  receivePresencePlayerJoined:
    action: receive
    channel:
      $ref: "#/channels/gameSession"
    messages:
      - $ref: "#/channels/gameSession/messages/presencePlayerJoined"
  receivePresencePlayerLeft:
    action: receive
    channel:
      $ref: "#/channels/gameSession"
    messages:
      - $ref: "#/channels/gameSession/messages/presencePlayerLeft"
  receivePlayerKicked:
    action: receive
    channel:
      $ref: "#/channels/gameSession"
    messages:
      - $ref: "#/channels/gameSession/messages/playerKicked"
  receiveGameStarted:
    action: receive
    channel:
      $ref: "#/channels/gameSession"
    messages:
      - $ref: "#/channels/gameSession/messages/gameStarted"
  receiveQuestionStarted:
    action: receive
    channel:
      $ref: "#/channels/gameSession"
    messages:
      - $ref: "#/channels/gameSession/messages/questionStarted"
  receiveQuestionEnded:
    action: receive
    channel:
      $ref: "#/channels/gameSession"
    messages:
      - $ref: "#/channels/gameSession/messages/questionEnded"
  receiveQuestionReviewed:
    action: receive
    channel:
      $ref: "#/channels/gameSession"
    messages:
      - $ref: "#/channels/gameSession/messages/questionReviewed"
  receiveQuestionAnswersReset:
    action: receive
    channel:
      $ref: "#/channels/gameSession"
    messages:
      - $ref: "#/channels/gameSession/messages/questionAnswersReset"
  receiveAnswerResult:
    action: receive
    channel:
      $ref: "#/channels/gameSession"
    messages:
      - $ref: "#/channels/gameSession/messages/answerResult"
  receiveLeaderboardUpdated:
    action: receive
    channel:
      $ref: "#/channels/gameSession"
    messages:
      - $ref: "#/channels/gameSession/messages/leaderboardUpdated"
  receiveGameEnded:
    action: receive
    channel:
      $ref: "#/channels/gameSession"
    messages:
      - $ref: "#/channels/gameSession/messages/gameEnded"
  receiveError:
    action: receive
    channel:
      $ref: "#/channels/gameSession"
    messages:
      - $ref: "#/channels/gameSession/messages/errorMessage"
  sendAnswerSubmit:
    action: send
    channel:
      $ref: "#/channels/gameSession"
    messages:
      - $ref: "#/channels/gameSession/messages/answerSubmit"

components:
  messages:
    presencePlayerJoined:
      name: presence.playerJoined
      payload:
        $ref: "#/components/schemas/PresencePlayerJoined"
    presencePlayerLeft:
      name: presence.playerLeft
      payload:
        $ref: "#/components/schemas/PresencePlayerLeft"
    playerKicked:
      name: player.kicked
      payload:
        $ref: "#/components/schemas/PlayerKicked"
    gameStarted:
      name: game.started
      payload:
        $ref: "#/components/schemas/GameStarted"
    questionStarted:
      name: question.started
      payload:
        $ref: "#/components/schemas/QuestionStarted"
    questionEnded:
      name: question.ended
      payload:
        $ref: "#/components/schemas/QuestionEnded"
    questionReviewed:
      name: question.reviewed
      payload:
        $ref: "#/components/schemas/QuestionReviewed"
    questionAnswersReset:
      name: question.answersReset
      payload:
        $ref: "#/components/schemas/QuestionAnswersReset"
    answerResult:
      name: answer.result
      payload:
        $ref: "#/components/schemas/AnswerResult"
    leaderboardUpdated:
      name: leaderboard.updated
      payload:
        $ref: "#/components/schemas/LeaderboardUpdated"
    gameEnded:
      name: game.ended
      payload:
        $ref: "#/components/schemas/GameEnded"
    errorMessage:
      name: error
      payload:
        $ref: "#/components/schemas/ErrorPayload"
    answerSubmit:
      name: answer.submit
      payload:
        $ref: "#/components/schemas/AnswerSubmit"

  schemas:
    PlayerSummary:
      type: object
      required: [clientId, nickname]
      properties:
        clientId:
          type: string
        nickname:
          type: string

    PresencePlayerJoined:
      type: object
      required: [player, playerCount]
      properties:
        player:
          $ref: "#/components/schemas/PlayerSummary"
        playerCount:
          type: integer

    PresencePlayerLeft:
      type: object
      required: [clientId, playerCount]
      properties:
        clientId:
          type: string
        playerCount:
          type: integer

    PlayerKicked:
      type: object
      required: [reason]
      description: >
        Unicast to the removed player only; the rest of the room instead
        sees the normal presence.playerLeft once the connection drops.
      properties:
        reason:
          type: string

    GameStarted:
      type: object
      required: [startedAt]
      properties:
        startedAt:
          type: string
          format: date-time

    QuestionOption:
      type: object
      required: [id, text]
      properties:
        id:
          type: string
        text:
          type: string

    QuestionStarted:
      type: object
      required: [questionIndex, questionId, type, prompt, options, timed, timeLimitSeconds, totalQuestions]
      properties:
        questionIndex:
          type: integer
        questionId:
          type: string
        type:
          type: string
          enum: [multiple_choice, free_text]
          description: >
            Determines how the client should collect an answer: option
            buttons for multiple_choice, a text field (max 500 characters)
            for free_text. free_text questions always have an empty
            options array.
        prompt:
          type: string
        options:
          type: array
          items:
            $ref: "#/components/schemas/QuestionOption"
        timed:
          type: boolean
          description: Whether the client should show a countdown for this question.
        timeLimitSeconds:
          type: integer
        totalQuestions:
          type: integer
        yourAnswer:
          $ref: "#/components/schemas/YourAnswer"

    YourAnswer:
      type: object
      required: [pending]
      description: >
        Present on question.started only when the recipient has already
        answered this question — this happens when the admin resumes live
        play after reviewing an earlier question, or when a player
        reconnects mid-question, both of which redeliver question.started
        for a question that may not actually be fresh to this client.
        Its absence means the client has not answered yet.
      properties:
        optionId:
          type: string
          description: Set for a multiple_choice answer.
        text:
          type: string
          description: Set for a free_text answer.
        pending:
          type: boolean
          description: True for a free_text answer not yet graded by the admin.
        correct:
          type: boolean
          description: Meaningless while pending.
        pointsAwarded:
          type: integer
          description: Meaningless while pending.

    AnswerCount:
      type: object
      required: [optionId, count]
      properties:
        optionId:
          type: string
        count:
          type: integer

    QuestionEnded:
      type: object
      required: [questionIndex, questionId, answerCounts]
      description: >
        correctOptionId is only present for multiple_choice questions —
        free_text questions have no automatic verdict, so answerCounts is
        always empty for them too. A free_text player instead receives a
        second answer.result once the admin grades their answer by hand.
      properties:
        questionIndex:
          type: integer
        questionId:
          type: string
        correctOptionId:
          type: string
        answerCounts:
          type: array
          items:
            $ref: "#/components/schemas/AnswerCount"

    QuestionReviewed:
      type: object
      required: [questionIndex, questionId, prompt, options, answerCounts, totalQuestions]
      description: >
        A read-only recap of a previous question, sent when the admin goes
        back. Unlike question.started, the correct answer is already known
        (it was already revealed), and clients must not offer a way to
        answer it. correctOptionId and answerCounts are only meaningful
        for multiple_choice — free_text has no per-option breakdown.
      properties:
        questionIndex:
          type: integer
        questionId:
          type: string
        prompt:
          type: string
        options:
          type: array
          items:
            $ref: "#/components/schemas/QuestionOption"
        correctOptionId:
          type: string
        answerCounts:
          type: array
          items:
            $ref: "#/components/schemas/AnswerCount"
        totalQuestions:
          type: integer

    QuestionAnswersReset:
      type: object
      required: [questionIndex, questionId]
      description: >
        Broadcast after the admin wipes every answer to a question and
        reverses its points. If this is the question currently live for a
        client, they should be allowed to answer it again.
      properties:
        questionIndex:
          type: integer
        questionId:
          type: string

    AnswerResult:
      type: object
      required: [questionId, correct, pointsAwarded, totalScore, pending]
      description: >
        Sent once when a multiple_choice answer is scored automatically.
        For free_text, sent twice: first right after submission with
        pending true (correct/pointsAwarded not yet meaningful), then
        again once the admin grades it by hand with pending false and the
        final verdict.
      properties:
        questionId:
          type: string
        correct:
          type: boolean
        pointsAwarded:
          type: integer
        totalScore:
          type: integer
        pending:
          type: boolean

    LeaderboardEntry:
      type: object
      required: [clientId, nickname, score, rank, color]
      properties:
        clientId:
          type: string
        nickname:
          type: string
        score:
          type: integer
        rank:
          type: integer
        color:
          type: string
          description: >
            One of a small, curated set of cosmos-themed color IDs (see
            the REST API's PlayerColor schema) — not a full color range.
          enum: [nebula, comet, nova, quasar, solar, crimson]

    LeaderboardUpdated:
      type: object
      required: [questionIndex, entries]
      properties:
        questionIndex:
          type: integer
        entries:
          type: array
          items:
            $ref: "#/components/schemas/LeaderboardEntry"

    GameEnded:
      type: object
      required: [finalLeaderboard, endedAt]
      properties:
        finalLeaderboard:
          type: array
          items:
            $ref: "#/components/schemas/LeaderboardEntry"
        endedAt:
          type: string
          format: date-time

    ErrorPayload:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string

    AnswerSubmit:
      type: object
      required: [questionId]
      description: >
        Exactly one of optionId (multiple_choice) or text (free_text,
        max 500 characters) must be set, matching the current question's
        type.
      properties:
        questionId:
          type: string
        optionId:
          type: string
        text:
          type: string
          maxLength: 500
