openapi: 3.0.3
info:
  title: Quizmos API
  description: REST API for the Quizmos trivia/pub-quiz application.
  version: 0.1.0

servers:
  - url: /api

security: []

tags:
  - name: quizzes
  - name: questions
  - name: games
  - name: players

paths:
  /admin/quizzes:
    post:
      operationId: createQuiz
      tags: [quizzes]
      summary: Create a quiz
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateQuizRequest"
      responses:
        "201":
          description: Quiz created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quiz"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    get:
      operationId: listQuizzes
      tags: [quizzes]
      summary: List quizzes
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Quizzes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Quiz"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /admin/quizzes/{quizId}:
    parameters:
      - $ref: "#/components/parameters/QuizId"
    get:
      operationId: getQuiz
      tags: [quizzes]
      summary: Get a quiz with its questions
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Quiz
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuizDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateQuiz
      tags: [quizzes]
      summary: Update a quiz
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateQuizRequest"
      responses:
        "200":
          description: Updated quiz
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quiz"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteQuiz
      tags: [quizzes]
      summary: >
        Delete a quiz and everything created from it: its questions,
        every game ever played from it (lobby, in-progress, or ended)
        along with their players and answers, and any question media
        stored in object storage.
      security: [{ bearerAuth: [] }]
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /admin/quizzes/{quizId}/questions:
    parameters:
      - $ref: "#/components/parameters/QuizId"
    post:
      operationId: createQuestion
      tags: [questions]
      summary: Add a question to a quiz
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateQuestionRequest"
      responses:
        "201":
          description: Question created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Question"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    get:
      operationId: listQuestions
      tags: [questions]
      summary: List a quiz's questions, in order
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Questions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Question"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /admin/quizzes/{quizId}/questions/order:
    parameters:
      - $ref: "#/components/parameters/QuizId"
    put:
      operationId: reorderQuestions
      tags: [questions]
      summary: Reorder a quiz's questions
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReorderQuestionsRequest"
      responses:
        "200":
          description: Questions in new order
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Question"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /admin/quizzes/{quizId}/questions/{questionId}:
    parameters:
      - $ref: "#/components/parameters/QuizId"
      - $ref: "#/components/parameters/QuestionId"
    get:
      operationId: getQuestion
      tags: [questions]
      summary: Get a question
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Question
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Question"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateQuestion
      tags: [questions]
      summary: Update a question
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateQuestionRequest"
      responses:
        "200":
          description: Updated question
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Question"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteQuestion
      tags: [questions]
      summary: Delete a question
      security: [{ bearerAuth: [] }]
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /admin/quizzes/{quizId}/questions/{questionId}/media:
    parameters:
      - $ref: "#/components/parameters/QuizId"
      - $ref: "#/components/parameters/QuestionId"
      - $ref: "#/components/parameters/Authorization"
    post:
      operationId: uploadQuestionMedia
      tags: [questions]
      summary: >
        Attach an optional image or audio fragment to a question,
        replacing any existing media. Shown to players when the question
        starts, and to the admin during the live game (to play audio
        centrally or reference the image while giving a hint). Requires
        an admin bearer token (see the Authorization parameter) — not
        secured via the usual bearerAuth scheme, since standard request
        validation would consume the multipart body before the handler
        can stream it to storage.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: Media attached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Question"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteQuestionMedia
      tags: [questions]
      summary: >
        Remove a question's attached media, if any. Uses the same manual
        Authorization check as the upload operation, for consistency
        between the two.
      responses:
        "200":
          description: Media removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Question"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /admin/games:
    post:
      operationId: createGame
      tags: [games]
      summary: Create a game session from a quiz
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGameRequest"
      responses:
        "201":
          description: Game created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminGame"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    get:
      operationId: listGames
      tags: [games]
      summary: List game sessions
      security: [{ bearerAuth: [] }]
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/GameStatus"
      responses:
        "200":
          description: Games
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminGame"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /admin/games/{gameId}:
    parameters:
      - $ref: "#/components/parameters/GameId"
    get:
      operationId: getGame
      tags: [games]
      summary: Get full game detail (admin view, includes correct answers)
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Game detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminGameDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /admin/games/{gameId}/start:
    parameters:
      - $ref: "#/components/parameters/GameId"
    post:
      operationId: startGame
      tags: [games]
      summary: Start a game (lobby -> in_progress)
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Game started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminGame"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /admin/games/{gameId}/next-question:
    parameters:
      - $ref: "#/components/parameters/GameId"
    post:
      operationId: advanceGame
      tags: [games]
      summary: End the current question and advance to the next one, or end the game if exhausted
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Game advanced
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminGame"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /admin/games/{gameId}/review-question:
    parameters:
      - $ref: "#/components/parameters/GameId"
    post:
      operationId: reviewQuestion
      tags: [games]
      summary: >
        Re-show an already-asked question to players for reference (e.g.
        the admin advanced too fast, or wants to recap for latecomers).
        This is a pure broadcast — it never reopens the question for
        answers and never changes the game's actual current question, so
        "next question" always continues from wherever live play really
        is. Only questions at or before the current one can be reviewed.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewQuestionRequest"
      responses:
        "200":
          description: Question re-broadcast to players
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminGame"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /admin/games/{gameId}/reset-answers:
    parameters:
      - $ref: "#/components/parameters/GameId"
    post:
      operationId: resetQuestionAnswers
      tags: [games]
      summary: >
        Wipe every player's answer to one already-asked question and
        reverse any points it awarded, so it can be answered again. For
        recovering from a mistake (e.g. the wrong option was marked
        correct, or the question started before everyone was ready) —
        not for routine use. Only questions at or before the current one
        can be reset.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetAnswersRequest"
      responses:
        "200":
          description: Answers reset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminGame"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /admin/games/{gameId}/end:
    parameters:
      - $ref: "#/components/parameters/GameId"
    post:
      operationId: endGame
      tags: [games]
      summary: Force-end a game
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Game ended
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminGame"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /admin/games/{gameId}/leaderboard:
    parameters:
      - $ref: "#/components/parameters/GameId"
    get:
      operationId: getAdminLeaderboard
      tags: [games]
      summary: Leaderboard snapshot for the admin dashboard
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Leaderboard
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Leaderboard"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /admin/games/{gameId}/ws-ticket:
    parameters:
      - $ref: "#/components/parameters/GameId"
    post:
      operationId: createGameWsTicket
      tags: [games]
      summary: >
        Mint a short-lived, single-use ticket for connecting to the admin
        live-updates websocket (GET /ws/admin/games/{gameId}?ticket=...).
        A ticket exists because browsers can't attach the Authorization
        header to a websocket handshake — this keeps the actual bearer
        token out of the connection URL (and therefore out of logs/traces)
        while still gating the socket on the caller having a valid admin
        session right now.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Ticket minted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameWsTicket"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /admin/games/{gameId}/questions/{questionId}/answers:
    parameters:
      - $ref: "#/components/parameters/GameId"
      - name: questionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: listFreeTextAnswers
      tags: [games]
      summary: >
        List every free-text answer submitted so far for one question in
        this game, for the admin to grade. Always empty for
        multiple_choice questions, which are scored automatically.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Free-text answers, oldest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FreeTextAnswer"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /admin/games/{gameId}/answers/{answerId}/grade:
    parameters:
      - $ref: "#/components/parameters/GameId"
      - name: answerId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: gradeAnswer
      tags: [games]
      summary: >
        Manually grade one free-text answer: full points for the question
        if correct, none otherwise. Can be called again to change a
        grading mistake — the player's score is adjusted by the
        difference, not just added to.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GradeAnswerRequest"
      responses:
        "200":
          description: Answer graded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FreeTextAnswer"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /admin/games/{gameId}/players/{clientId}:
    parameters:
      - $ref: "#/components/parameters/GameId"
      - name: clientId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      operationId: kickPlayer
      tags: [players]
      summary: >
        Remove a player from the lobby. Only allowed before the game
        starts — once it's in progress, removing someone mid-round would
        orphan their in-flight answers and skew scoring, so this is
        lobby-only. A kicked player can rejoin with a fresh nickname like
        anyone else; this isn't a ban.
      security: [{ bearerAuth: [] }]
      responses:
        "204":
          description: Player removed
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /games/join:
    post:
      operationId: joinGame
      tags: [players]
      summary: >
        Join a game by its join code. Only allowed while the game is in
        the lobby — once it's in progress or has ended, this returns 409.
      parameters:
        - $ref: "#/components/parameters/ClientId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JoinGameRequest"
      responses:
        "200":
          description: Joined
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JoinGameResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /games/{code}:
    get:
      operationId: getPublicGame
      tags: [players]
      summary: Public lookup of a game by join code
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Game summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicGame"
        "404":
          $ref: "#/components/responses/NotFound"

  /games/{code}/leaderboard:
    get:
      operationId: getPublicLeaderboard
      tags: [players]
      summary: Public leaderboard snapshot
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/OptionalClientId"
      responses:
        "200":
          description: Leaderboard
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Leaderboard"
        "404":
          $ref: "#/components/responses/NotFound"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Keycloak-issued access token; caller must hold the `quiz-admin` realm role.

  parameters:
    QuizId:
      name: quizId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    QuestionId:
      name: questionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    GameId:
      name: gameId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ClientId:
      name: X-Client-Id
      in: header
      required: true
      schema:
        type: string
        format: uuid
    OptionalClientId:
      name: X-Client-Id
      in: header
      required: false
      schema:
        type: string
        format: uuid
    Authorization:
      name: Authorization
      in: header
      required: false
      description: >
        "Bearer <token>". Declared as a plain, optional header parameter
        (checked manually in the handler, which treats an absent header
        the same as an empty one) rather than a bearerAuth security
        scheme, and excluded from the usual OpenAPI request validation —
        both specifically for the media upload/delete operations, whose
        multipart request body must reach the handler unconsumed. The
        standard validator reads the whole multipart body to validate
        it, which would leave nothing for the handler to stream to
        storage. Marking it required would fail a request missing this
        header in generated parameter-binding code before the handler
        gets a chance to — bypassing the manual check entirely and
        returning a raw 400 instead of the intended 401.
      schema:
        type: string

  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Missing or invalid bearer token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Valid token but missing the required role
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: Conflicts with current resource state
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string

    QuestionType:
      type: string
      enum: [multiple_choice, free_text]

    GameStatus:
      type: string
      enum: [lobby, in_progress, ended]

    Quiz:
      type: object
      required: [id, title, questionCount, timed, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
        questionCount:
          type: integer
        timed:
          type: boolean
          description: >
            Whether questions in this quiz show a countdown to players.
            When false, the admin paces the game manually with no time
            pressure shown.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    QuizDetail:
      allOf:
        - $ref: "#/components/schemas/Quiz"
        - type: object
          required: [questions]
          properties:
            questions:
              type: array
              items:
                $ref: "#/components/schemas/Question"

    CreateQuizRequest:
      type: object
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
        description:
          type: string
        timed:
          type: boolean
          default: true

    UpdateQuizRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 1
        description:
          type: string
        timed:
          type: boolean

    QuestionOption:
      type: object
      required: [id, text]
      properties:
        id:
          type: string
          format: uuid
        text:
          type: string

    QuestionOptionWithAnswer:
      allOf:
        - $ref: "#/components/schemas/QuestionOption"
        - type: object
          required: [isCorrect]
          properties:
            isCorrect:
              type: boolean

    MediaType:
      type: string
      enum: [image, audio]

    Question:
      type: object
      required: [id, quizId, type, prompt, position, timeLimitSeconds, points, options]
      properties:
        id:
          type: string
          format: uuid
        quizId:
          type: string
          format: uuid
        type:
          $ref: "#/components/schemas/QuestionType"
        prompt:
          type: string
        position:
          type: integer
        timeLimitSeconds:
          type: integer
        points:
          type: integer
        options:
          type: array
          items:
            $ref: "#/components/schemas/QuestionOptionWithAnswer"
        mediaUrl:
          type: string
          description: Absent when the question has no attached media.
        mediaType:
          $ref: "#/components/schemas/MediaType"

    CreateQuestionOption:
      type: object
      required: [text, isCorrect]
      properties:
        text:
          type: string
          minLength: 1
        isCorrect:
          type: boolean

    CreateQuestionRequest:
      type: object
      required: [type, prompt]
      description: >
        options is required (2 or more) for multiple_choice and must be
        omitted (or empty) for free_text — free_text answers are always
        graded manually by the admin, not against a stored correct answer.
      properties:
        type:
          $ref: "#/components/schemas/QuestionType"
        prompt:
          type: string
          minLength: 1
        timeLimitSeconds:
          type: integer
          default: 30
        points:
          type: integer
          default: 1000
        options:
          type: array
          items:
            $ref: "#/components/schemas/CreateQuestionOption"

    UpdateQuestionRequest:
      type: object
      properties:
        prompt:
          type: string
          minLength: 1
        timeLimitSeconds:
          type: integer
        points:
          type: integer
        options:
          type: array
          items:
            $ref: "#/components/schemas/CreateQuestionOption"

    ReorderQuestionsRequest:
      type: object
      required: [questionIds]
      properties:
        questionIds:
          type: array
          items:
            type: string
            format: uuid

    ReviewQuestionRequest:
      type: object
      required: [questionIndex]
      properties:
        questionIndex:
          type: integer
          minimum: 0
          description: Must be at or before the game's current question index.

    ResetAnswersRequest:
      type: object
      required: [questionIndex]
      properties:
        questionIndex:
          type: integer
          minimum: 0
          description: Must be at or before the game's current question index.

    GameWsTicket:
      type: object
      required: [ticket]
      properties:
        ticket:
          type: string
          description: >
            Single-use, short-lived (~30s) opaque token. Pass it as
            ?ticket=... on GET /ws/admin/games/{gameId}; it's consumed on
            first use and expires quickly otherwise, so mint a fresh one
            per connection attempt rather than caching it.

    FreeTextAnswer:
      type: object
      required: [id, clientId, nickname, text, graded]
      properties:
        id:
          type: string
          format: uuid
        clientId:
          type: string
          format: uuid
        nickname:
          type: string
        text:
          type: string
        graded:
          type: boolean
        correct:
          type: boolean
          description: Only meaningful once graded is true.
        pointsAwarded:
          type: integer

    GradeAnswerRequest:
      type: object
      required: [correct]
      properties:
        correct:
          type: boolean

    CreateGameRequest:
      type: object
      required: [quizId]
      properties:
        quizId:
          type: string
          format: uuid

    AdminGame:
      type: object
      required: [id, quizId, quizTitle, code, status, currentQuestionIndex, totalQuestions, playerCount, createdAt]
      properties:
        id:
          type: string
          format: uuid
        quizId:
          type: string
          format: uuid
        quizTitle:
          type: string
        code:
          type: string
        status:
          $ref: "#/components/schemas/GameStatus"
        currentQuestionIndex:
          type: integer
          nullable: true
        totalQuestions:
          type: integer
        playerCount:
          type: integer
        createdAt:
          type: string
          format: date-time

    PlayerColor:
      type: string
      description: >
        A small, curated set of cosmos-themed color choices — not a full
        color picker — so every player's pick reads clearly against the
        dark theme and stays distinct from the app's own semantic colors.
      enum: [nebula, comet, nova, quasar, solar, crimson]

    AdminPlayer:
      type: object
      required: [clientId, nickname, score, connected, color]
      properties:
        clientId:
          type: string
          format: uuid
        nickname:
          type: string
        score:
          type: integer
        connected:
          type: boolean
        color:
          $ref: "#/components/schemas/PlayerColor"

    AdminGameDetail:
      allOf:
        - $ref: "#/components/schemas/AdminGame"
        - type: object
          required: [players]
          properties:
            players:
              type: array
              items:
                $ref: "#/components/schemas/AdminPlayer"

    JoinGameRequest:
      type: object
      required: [code, nickname]
      properties:
        code:
          type: string
        nickname:
          type: string
          minLength: 1
          maxLength: 32
        color:
          type: string
          description: >
            One of PlayerColor's values, ideally — but deliberately typed
            as a plain string here (not $ref'd) rather than validated
            against the enum, so an unrecognized or omitted value falls
            back to a default instead of failing the whole join.

    JoinGameResponse:
      type: object
      required: [gameId, code, status, nickname, color]
      properties:
        gameId:
          type: string
          format: uuid
        code:
          type: string
        status:
          $ref: "#/components/schemas/GameStatus"
        nickname:
          type: string
        color:
          $ref: "#/components/schemas/PlayerColor"

    PublicGame:
      type: object
      required: [code, quizTitle, status, playerCount]
      properties:
        code:
          type: string
        quizTitle:
          type: string
        status:
          $ref: "#/components/schemas/GameStatus"
        playerCount:
          type: integer

    LeaderboardEntry:
      type: object
      required: [clientId, nickname, score, rank, color]
      properties:
        clientId:
          type: string
          format: uuid
        nickname:
          type: string
        score:
          type: integer
        rank:
          type: integer
        color:
          $ref: "#/components/schemas/PlayerColor"

    Leaderboard:
      type: object
      required: [entries]
      properties:
        entries:
          type: array
          items:
            $ref: "#/components/schemas/LeaderboardEntry"
