services:
  postgres:
    image: docker.io/library/postgres:17-alpine
    environment:
      POSTGRES_DB: quizmos
      POSTGRES_USER: quizmos
      POSTGRES_PASSWORD: quizmos-dev
    ports:
      - "5432:5432"
    volumes:
      - quizmos-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quizmos"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      # Enables the /health/ready endpoint the healthcheck below polls —
      # off by default. It listens on the internal management port (9000),
      # not one we need to publish to the host.
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8081:8080"
    volumes:
      - ./deploy/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    healthcheck:
      # The keycloak image has no curl/wget; this is bash's /dev/tcp trick
      # for a bare HTTP GET, checked against the management health port.
      # Startup (realm import included) can take a while, hence the long
      # start_period before failures count.
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          echo -e "GET /health/ready HTTP/1.1\r\nhost: localhost\r\nConnection: close\r\n\r\n" >&3 &&
          grep -q "200" <&3
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  minio:
    image: docker.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000" # S3 API — question media (images/audio) is fetched from here directly by browsers
      - "9001:9001" # web console, handy for poking at the bucket during a demo
    volumes:
      - quizmos-minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: applies backend/internal/db/migrations to postgres, then
  # exits. The backend depends on this finishing successfully rather than
  # migrating itself, so the schema is always in place before it starts
  # serving requests.
  migrate:
    image: docker.io/migrate/migrate:v4.19.1
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/internal/db/migrations:/migrations:ro
    command:
      - -path=/migrations
      - -database=postgres://quizmos:quizmos-dev@postgres:5432/quizmos?sslmode=disable
      - up
    restart: "no"

  # All-in-one Grafana + Loki (logs) + Tempo (traces) + Mimir/Prometheus
  # (metrics, unused for now) + an embedded OTel Collector, for local
  # observability — see backend/internal/telemetry. Grafana's UI is at
  # http://localhost:3000; no login is required for local anonymous access.
  lgtm:
    image: docker.io/grafana/otel-lgtm:latest
    ports:
      - "3000:3000" # Grafana UI
      - "4317:4317" # OTLP gRPC — what OTEL_EXPORTER_OTLP_ENDPOINT points at
      - "4318:4318" # OTLP HTTP
    volumes:
      # Adds the "Quizmos" dashboard (deploy/grafana/dashboards) alongside
      # the image's own built-in ones — this only *adds* a provider file,
      # it doesn't replace grafana-dashboards.yaml already baked into the
      # image.
      - ./deploy/grafana/provisioning/dashboards.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/quizmos.yaml:ro
      - ./deploy/grafana/dashboards:/otel-lgtm/dashboards:ro

  backend:
    build:
      context: ./backend
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      minio:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      # No health condition: telemetry.Setup must never block the backend
      # from serving real traffic just because the observability stack is
      # slow to start or unreachable.
      lgtm:
        condition: service_started
    environment:
      DATABASE_URL: postgres://quizmos:quizmos-dev@postgres:5432/quizmos?sslmode=disable
      OTEL_EXPORTER_OTLP_ENDPOINT: lgtm:4317
      # "json" (default) or "text" — see internal/telemetry.NewStdoutHandler.
      # Only affects stdout; the OTLP/Loki export is always JSON. Override
      # per-run with e.g. `LOG_FORMAT=text docker compose up backend`.
      LOG_FORMAT: ${LOG_FORMAT:-json}
      # Must be the exact string the browser uses to reach Keycloak (see
      # frontend's VITE_KEYCLOAK_ISSUER default) — the backend checks the
      # JWT's `iss` claim against this literally.
      KEYCLOAK_ISSUER: http://localhost:8081/realms/quizmos
      # Where the backend itself fetches the JWKS from — the internal
      # docker network address. Kept separate from KEYCLOAK_ISSUER above
      # because "localhost" inside this container doesn't reliably mean
      # "the host" across engines (works via Docker Desktop's DNS trick,
      # unreliable under Podman), whereas the "keycloak" service name
      # always resolves on the compose network regardless of engine.
      KEYCLOAK_INTERNAL_ISSUER: http://keycloak:8080/realms/quizmos
      ADMIN_ROLE: quiz-admin
      FRONTEND_ORIGIN: http://localhost:5173
      # S3_ENDPOINT is where the backend itself uploads question media —
      # the internal docker network address. S3_PUBLIC_URL is what gets
      # baked into the URLs returned to clients, since a browser fetches
      # media directly from MinIO, not through the backend; unlike
      # Keycloak's issuer, no identity check ties these together, so they
      # can safely point at different addresses.
      S3_ENDPOINT: minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: quizmos-media
      S3_PUBLIC_URL: http://localhost:9000
    ports:
      - "8080:8080"
    restart: on-failure

  frontend:
    build:
      context: ./frontend
    depends_on:
      - backend
    ports:
      - "5173:3000"

volumes:
  quizmos-postgres-data:
  quizmos-minio-data:
