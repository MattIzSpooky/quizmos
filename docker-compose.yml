services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: quizmos
      POSTGRES_USER: quizmos
      POSTGRES_PASSWORD: quizmos-dev
    ports:
      - "5432:5432"
    volumes:
      - quizmos-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quizmos"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      # Enables the /health/ready endpoint the healthcheck below polls —
      # off by default. It listens on the internal management port (9000),
      # not one we need to publish to the host.
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8081:8080"
    volumes:
      - ./deploy/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    healthcheck:
      # The keycloak image has no curl/wget; this is bash's /dev/tcp trick
      # for a bare HTTP GET, checked against the management health port.
      # Startup (realm import included) can take a while, hence the long
      # start_period before failures count.
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          echo -e "GET /health/ready HTTP/1.1\r\nhost: localhost\r\nConnection: close\r\n\r\n" >&3 &&
          grep -q "200" <&3
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  # One-shot: applies backend/internal/db/migrations to postgres, then
  # exits. The backend depends on this finishing successfully rather than
  # migrating itself, so the schema is always in place before it starts
  # serving requests.
  migrate:
    image: migrate/migrate:v4.19.1
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/internal/db/migrations:/migrations:ro
    command:
      - -path=/migrations
      - -database=postgres://quizmos:quizmos-dev@postgres:5432/quizmos?sslmode=disable
      - up
    restart: "no"

  backend:
    build:
      context: ./backend
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://quizmos:quizmos-dev@postgres:5432/quizmos?sslmode=disable
      # Must be the exact string the browser uses to reach Keycloak (see
      # frontend's VITE_KEYCLOAK_ISSUER default) — the backend checks the
      # JWT's `iss` claim against this literally, and derives its JWKS URL
      # by appending a fixed suffix to it, so the two can't diverge.
      KEYCLOAK_ISSUER: http://localhost:8081/realms/quizmos
      ADMIN_ROLE: quiz-admin
      FRONTEND_ORIGIN: http://localhost:5173
    # "localhost" inside this container normally means itself, not the
    # host — but KEYCLOAK_ISSUER above has to say "localhost:8081" to
    # match what the browser sees. Redirecting it to the host gateway lets
    # the backend reach the keycloak container through the same
    # host-published port (8081) the browser uses, so both sides agree on
    # one issuer string without any extra backend configuration.
    extra_hosts:
      - "localhost:host-gateway"
    ports:
      - "8080:8080"
    restart: on-failure

  frontend:
    build:
      context: ./frontend
    depends_on:
      - backend
    ports:
      - "5173:3000"

volumes:
  quizmos-postgres-data:
