services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: quizmos
      POSTGRES_USER: quizmos
      POSTGRES_PASSWORD: quizmos-dev
    ports:
      - "5432:5432"
    volumes:
      - quizmos-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quizmos"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - "8081:8080"
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro

volumes:
  quizmos-postgres-data:
